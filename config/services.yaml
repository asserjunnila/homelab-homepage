- Infrastructure:
    - UniFi Network:
        href: https://unifi.ui.com/
        description: Networking
        icon: unifi
    - Proxmox Node 1:
        href: {{HOMEPAGE_VAR_PROXMOX1_HREF}}
        icon: proxmox
        description: Virtualization host — VMs & LXC containers
        ping: {{HOMEPAGE_VAR_PROXMOX1_URL}}
    - Proxmox Node 2:
        href: {{HOMEPAGE_VAR_PROXMOX2_HREF}}
        icon: proxmox
        description: Virtualization host — VMs & LXC containers
        ping: {{HOMEPAGE_VAR_PROXMOX2_URL}}
    - Proxmox Node 3:
        href: {{HOMEPAGE_VAR_PROXMOX3_HREF}}
        icon: proxmox
        description: Virtualization host — VMs & LXC containers
        ping: {{HOMEPAGE_VAR_PROXMOX3_URL}}
    - Pi-hole:
        href: {{HOMEPAGE_VAR_PIHOLE_HREF}}
        icon: pi-hole
        description: DNS and Ad Block
        ping: {{HOMEPAGE_VAR_PIHOLE_HREF}}
        widget:
          type: pihole
          version: 6
          url: {{HOMEPAGE_VAR_PIHOLE_URL}}
          key: {{HOMEPAGE_VAR_PIHOLE_KEY}}
    - Pi-hole 2:
        href: {{HOMEPAGE_VAR_PIHOLE_2_HREF}}
        icon: pi-hole
        description: DNS and Ad Block
        ping: {{HOMEPAGE_VAR_PIHOLE_2_HREF}}
        widget:
          type: pihole
          version: 6
          url: {{HOMEPAGE_VAR_PIHOLE_2_URL}}
          key: {{HOMEPAGE_VAR_PIHOLE_2_KEY}}

    - Nginx Proxy Manager:
        href: {{HOMEPAGE_VAR_NPM_HREF}}
        description: Reverse Proxy & TLS
        icon: nginx
        ping: {{HOMEPAGE_VAR_NPM_HREF}}
        widget:
            type: npm
            url: {{HOMEPAGE_VAR_NPM_HREF}}
            username: {{HOMEPAGE_VAR_NPM_USERNAME}}
            password: {{HOMEPAGE_VAR_NPM_PASSWORD}}
    - Portainer:
        href: {{HOMEPAGE_VAR_PORTAINER_HREF}}
        description: Container Management
        ping: {{HOMEPAGE_VAR_PORTAINER_HREF}}
        icon: portainer
        widget:
            type: portainer
            url: {{HOMEPAGE_VAR_PORTAINER_HREF}}
            env: 3
            kubernetes: false # optional, defaults to false
            key: {{HOMEPAGE_VAR_PORTAINER_KEY}}
    - Grafana:
        href: {{HOMEPAGE_VAR_GRAFANA_HREF}}
        description: Data Visualization
        ping: {{HOMEPAGE_VAR_GRAFANA_HREF}}
        icon: grafana
    - InfluxDB:
        href: {{HOMEPAGE_VAR_INFLUXDB_HREF}}
        description: Time Series Data Storage
        ping: {{HOMEPAGE_VAR_INFLUXDB_HREF}}
        icon: influxdb
    - Zigbee:
        href: {{HOMEPAGE_VAR_ZIGBEE_HREF}}
        description: Zigbee Coordinator
        ping: {{HOMEPAGE_VAR_ZIGBEE_HREF}}
        icon: zigbee
